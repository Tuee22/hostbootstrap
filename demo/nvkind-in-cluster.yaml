# Production nvkind template for the direct Linux GPU lane. It follows
# nvkind's default one-GPU-worker shape; local endpoints remain runtime-owned.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/tmp/hostbootstrap-demo-data
        containerPath: /var/lib/hostbootstrap-demo-data
  - role: worker
    labels:
      nvidia.com/gpu.present: "true"
    extraMounts:
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
      - hostPath: /var/tmp/hostbootstrap-demo-data
        containerPath: /var/lib/hostbootstrap-demo-data
