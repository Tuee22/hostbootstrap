# The kind cluster config for the demo's persistent stack. Local-only endpoints
# are allocated by the cluster exposure runtime after reconciliation, so the
# rendered cluster never reserves or publishes host ports.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/tmp/hostbootstrap-demo-data
        containerPath: /var/lib/hostbootstrap-demo-data
