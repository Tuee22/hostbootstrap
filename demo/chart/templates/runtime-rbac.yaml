apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-runtime-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-runtime-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-runtime-pod-reader
