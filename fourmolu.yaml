# The committed Haskell formatting contract (DEVELOPMENT_PLAN § R).
#
# Every setting is written out, including the ones that agree with the
# formatter's current defaults, so a base rebuild cannot change what passes
# through a changed default. The file fixes the configurable options and not the
# fourmolu version: the rolling base image installs the current compatible
# release, and a newer release can change its output under identical options.
#
# The values are the ones the existing sources agreed with most closely at
# adoption, measured on 2026-09-13 rather than guessed. Of the 190 library,
# sublibrary and consumer modules then present, 74 were already byte-identical
# under these settings, and every alternative tried agreed with fewer: 2-space
# indentation with leading module headers (0), single-line Haddock (6), leading
# function arrows (20), leading import/export lists (10). Every
# formatter-readable module now matches; the modules _FORMATTER_UNREADABLE in
# hostbootstrap/cli.py names are the ones fourmolu cannot parse.

indentation: 4
column-limit: none
function-arrows: trailing
comma-style: leading
import-export-style: diff-friendly
import-grouping: legacy
indent-wheres: false
record-brace-space: false
newlines-between-decls: 1
haddock-style: multi-line
haddock-style-module: null
haddock-location-signature: auto
let-style: auto
in-style: right-align
if-style: indented
single-constraint-parens: always
single-deriving-parens: always
sort-constraints: false
sort-derived-classes: false
sort-deriving-clauses: false
trailing-section-operators: true
unicode: never
respectful: true
fixities: []
reexports: []
local-modules: []
