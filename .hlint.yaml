# The committed Haskell linting contract (DEVELOPMENT_PLAN § R).
#
# Like fourmolu.yaml beside it, this file exists so the gate's verdict is a
# property of this repository rather than of whichever hlint the rolling base
# image last installed. It keeps hlint's default rule set and records, by name,
# every hint family the library's own conventions decline — so a finding outside
# these families is a new one, and fails.
#
# Two families are absent from this list on purpose. `Unused LANGUAGE pragma`
# and `Use fewer imports` name real defects rather than a spelling preference,
# and the sources were corrected instead of configured — except in the six
# modules named at the bottom of this file, where hlint reports a duplicate
# import that only a preprocessor branch it does not evaluate keeps apart.
#
# The worked consumer under demo/ is clean against the default set and is kept
# that way by the container check-code; nothing here relaxes it, because every
# entry below is a family the library declines and the consumer does not
# contain.

# --- Positional elimination -------------------------------------------------
# hostbootstrap-core.cabal carries -Wpartial-fields precisely so a sum's fields
# are eliminated positionally: a record selector on a multi-constructor type
# throws at the call site instead of failing to compile. `C {}` also hides an
# arity change that `C _ _ _` reports, which is the whole point of writing the
# underscores out.
- ignore: {name: Use record patterns}

# --- Phantom-indexed opaque values stay `data` ------------------------------
# The indexed values here are opaque and nominally roled on purpose. `newtype`
# makes the representation coercible, and `coerce` is exactly the operation that
# would strip a scope, plan, cluster or frame index from a value minted to carry
# it. A wrapper that cannot be coerced is worth the extra word.
- ignore: {name: Use newtype instead of data}

# --- Arguments keep their names ---------------------------------------------
# Eta reduction removes the parameter name, which is frequently the only place a
# reader learns what the argument is. It can also change strictness and
# monomorphism, neither of which should turn on a formatting preference.
- ignore: {name: Eta reduce}

# --- Character classes are written as the ranges they mean ------------------
# A digest, a hex digit, a port number and a canonical identifier are ASCII by
# specification, and the testing doctrine requires guards that cannot decode
# differently on another gate host. `'0' <= c && c <= '9'` says ASCII and stays
# saying it; a Data.Char classifier is a promise about a library's definition.
- ignore: {name: Use isDigit}
- ignore: {name: Use isAsciiUpper}
- ignore: {name: Use isAsciiLower}

# --- Explicit spellings over combinator spellings ---------------------------
# The library is read far more often than it is written, and it prefers a
# spelling a reader can follow without first recognising a combinator: an
# explicit lambda over a section or a point-free composition, an explicit `case`
# over `maybe`/`fromMaybe`/`either`, an explicit `() <$ x` over `void x`, and an
# explicit `if`/`>>=` chain over `when`, `unless` and `join`. These are
# preferences, not defects, and naming each family here is what keeps them
# preferences rather than drift.
- ignore: {name: Avoid lambda}
- ignore: {name: "Avoid lambda using `infix`"}
- ignore: {name: Avoid reverse}
- ignore: {name: Evaluate}
- ignore: {name: Fuse foldr/map}
- ignore: {name: Hoist not}
- ignore: {name: Move guards forward}
- ignore: {name: Redundant bracket}
- ignore: {name: Redundant guard}
- ignore: {name: Redundant if}
- ignore: {name: Redundant map}
- ignore: {name: Redundant toList}
- ignore: {name: Replace case with fromMaybe}
- ignore: {name: Replace case with maybe}
- ignore: {name: "Use ++"}
- ignore: {name: "Use <$>"}
- ignore: {name: "Use <&>"}
- ignore: {name: "Use =<<"}
- ignore: {name: "Use >=>"}
- ignore: {name: Use all}
- ignore: {name: Use any}
- ignore: {name: Use catMaybes}
- ignore: {name: Use const}
- ignore: {name: Use elem}
- ignore: {name: Use first}
- ignore: {name: Use fmap}
- ignore: {name: Use fromMaybe}
- ignore: {name: Use fromRight}
- ignore: {name: Use guards}
- ignore: {name: Use isJust}
- ignore: {name: Use isNothing}
- ignore: {name: Use join}
- ignore: {name: Use lambda}
- ignore: {name: Use lambda-case}
- ignore: {name: Use lefts}
- ignore: {name: Use let}
- ignore: {name: Use list comprehension}
- ignore: {name: Use rights}
- ignore: {name: Use sequence_}
- ignore: {name: Use traverse_}
- ignore: {name: Use tuple-section}
- ignore: {name: Use unless}
- ignore: {name: Use void}
- ignore: {name: Use when}
- ignore: {name: Use zipWith}

# --- Imports hlint cannot see are conditional -------------------------------
# hlint does not evaluate CPP, so in these six modules it reads the two halves
# of an `#if`/`#else` as one scope and reports a duplicate import of a module
# that is imported exactly once on each platform. Merging the two would import
# a Windows-absent name on Windows, so the finding is refused here rather than
# in the source.
- ignore:
    name: Use fewer imports
    within:
      - HostBootstrap.Registry
      - HostBootstrap.Ownership.Posix
      - HostBootstrap.Ownership.Shipped
      - HostBootstrap.Ensure.Colima.Backend.Resolver
      - HostBootstrap.Ensure.Colima.Backend.Resolver.Native
      - HostBootstrap.Ensure.Colima.Backend.Runner
